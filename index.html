<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ร้านพร้อม</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mut:#6b7280;--line:#e5e7eb;--acc:#ea580c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#171a20;--ink:#eef0f4;--mut:#9aa1ad;--line:#262b34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:26px;margin:0 0 6px}
p.sub{color:var(--mut);margin:0 0 24px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:inherit;margin-bottom:12px}
a.card:hover{border-color:var(--acc)}
.nm{font-weight:700}
.tg{color:var(--mut);font-size:14px}
.go{color:var(--acc);font-size:14px;font-weight:600;margin-top:8px}
footer{color:var(--mut);font-size:13px;margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
</style></head><body>
<div class="wrap">
<h1>ร้านพร้อม</h1>
<p class="sub">หน้าร้านออนไลน์สำเร็จรูป ลูกค้ากดสั่ง จ่ายด้วย QR พร้อมเพย์ แล้ววิ่งเข้าแชทร้าน</p>
<a class="card" href="khongdee/">
  <div class="nm">ร้านของดีหน้าฝน</div>
  <div class="tg">ของใช้รับมือหน้าฝน ส่งไว เก็บเงินปลายทางได้</div>
  <div class="go">เปิดหน้าร้าน →</div>
</a>
<footer>ติดต่อทำหน้าร้าน: <a href="https://m.me/changbaanchabaplung" style="color:var(--acc)">ทักแชท</a></footer>
</div></body></html>
